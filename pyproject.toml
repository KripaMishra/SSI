[project]
name = "ssi"
version = "0.1.0"
description = "Sales intelligence agent API and workers"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "chromadb>=1.5.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.4.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "langfuse>=4.14.0",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
]

[dependency-groups]
# Test dependencies plus pandas, which the scripts/ analysis code imports
# (scripts/preprocess.py, scripts/eda_script.py, scripts/pipeline/structured_ingest.py).
dev = ["fakeredis>=2.0.0", "pandas>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
