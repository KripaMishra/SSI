services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Cache and queue share the compose Redis.
      REDIS_URL: redis://redis:6379/0
      QUEUE_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src/internal/db/ssi.db:/app/src/internal/db/ssi.db
      - ./.chroma:/app/.chroma
    depends_on:
      redis:
        condition: service_healthy
    # A model server running on the host (OPENAI_BASE_URL=http://localhost:8080/v1)
    # is reachable as host.docker.internal from inside the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    # One worker per API call type: this process runs the queued /ask tasks.
    # Each running task holds a thread for the whole agent run, so keep -t in
    # step with expected concurrency; scale out with `--scale worker=N`.
    command: ["dramatiq", "src.queue.actors", "-Q", "asks", "-t", "8"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src/internal/db/ssi.db:/app/src/internal/db/ssi.db
      - ./.chroma:/app/.chroma
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
